<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 211 112">
  <defs>
    <filter id="symbol-edge" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="2" dy="2" result="shifted"/>
      <feComposite in="shifted" in2="SourceAlpha" operator="out" result="edge"/>
      <feFlood flood-color="#fff" flood-opacity=".35" result="tint"/>
      <feComposite in="tint" in2="edge" operator="in" result="underlay"/>
      <feMerge><feMergeNode in="underlay"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <image width="211" height="112" href="data:image/png;base64," filter="url(#symbol-edge)"/>
</svg>
